        /* GTA-style radio buttons */
        input[type="radio"] {

            border-radius: 50%;
            outline: none;
            margin-right: 8px;
            position: relative;
            top: 3px;
        }
        
        input[type="radio"]:checked::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: #c4ba0a;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
        }
        
        /* GTA-style checkboxes */
        input[type="checkbox"] {
            appearance: none;

            outline: none;

            position: relative;
            top: 3px;
        }
        
        input[type="checkbox"]:checked::before {
            content: '✓';
            display: block;
            color: #c4ba0a;
            position: absolute;

    <script>
        // Handle create post button
        document.getElementById('create-post-btn').addEventListener('click', function() {
            window.location.href = 'index.php?community=Los+Santos&create_post=1';
        });
        
        // Handle reply buttons
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('reply-btn')) {
                e.preventDefault();
                const commentId = e.target.dataset.commentId;
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = 'index.php?community=Los+Santos&post_id=';
                form.innerHTML = `
                    <input type="hidden" name="post_id" value="">
                    <input type="hidden" name="parent_id" value="${commentId}">
                    <textarea class="comment-textarea" name="comment_content" placeholder="Write your reply..." required style="margin-top: 10px;"></textarea>
                    <button type="submit" name="add_comment" class="comment-submit">Reply</button>
                `;
                e.target.parentElement.parentElement.appendChild(form);
                e.target.style.display = 'none';
            }
        });
        
        // Show selected filename for image upload
        document.getElementById('post_image').addEventListener('change', function(e) {
            const label = document.querySelector('.file-upload-label');
            if (this.files.length > 0) {
                label.textContent = this.files[0].name;
                label.style.borderColor = '#c4ba0a';
            } else {
                label.textContent = 'Upload Image (Optional, max 5MB)';
                label.style.borderColor = '#333';
            }
        });
        
        // Add GTA-style radio effect
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
